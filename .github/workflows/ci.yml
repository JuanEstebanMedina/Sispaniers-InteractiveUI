name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: make lint

      - name: Type check
        run: make types

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Smoke run
        run: make smoke

  compose:
    name: Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose
        run: MONGO_PASSWORD=ci docker compose config --quiet
