server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # A variable target instead of a bare hostname makes nginx resolve
        # "backend" per-request instead of once at boot — when this image runs
        # somewhere with no such host (Railway, VITE_API_URL pointing straight
        # at the backend's own public URL instead), a request here just 502s
        # instead of nginx refusing to start at all.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16m;

        # /operations/:id/events es text/event-stream. Sin esto nginx acumula
        # el flujo en su búfer y los eventos llegan a destiempo o nunca.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
