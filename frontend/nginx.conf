server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sin barra final en proxy_pass: nginx pasa el URI TAL CUAL.
    # Con `http://backend:8000/` reescribía /api/operations/search →
    # /operations/search, y el backend monta todo bajo /api → 404 en todo.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /operations/:id/events es text/event-stream. Sin esto nginx acumula
        # el flujo en su búfer y los eventos llegan a destiempo o nunca.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
